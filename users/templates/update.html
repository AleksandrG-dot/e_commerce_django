{% extends 'catalog/base.html' %}

{% block content %}

<div class="container mt-5">
    <form class="row" method="post">
        <div class="col-3"></div>
        <div class="col-6">
            <h2 class="text-center">Редактирование пользователя {{ object.email }}</h2>
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="btn btn-primary">
                Сохранить
            </button>
            <a href="{% url 'catalog:home' %}" class="btn btn-secondary">Отмена</a>
        </div>
        <div class="col-3"></div>
    </form>
</div>
{% endblock %}
